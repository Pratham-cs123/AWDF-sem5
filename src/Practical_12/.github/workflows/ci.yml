name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Environment (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Execute Automated Jest Test Suite
        run: npm test
